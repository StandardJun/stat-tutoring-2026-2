name: Build and deploy to Pages

on:
  push:
    branches: [main]      # 빌드만 한다(배포 안 함). 소스가 깨지지 않았는지 바로 확인용.
  schedule:
    # GitHub의 schedule은 지연되거나 아예 건너뛰는 일이 있다(2026-09-30에 실제로 누락됨).
    # 재배포는 같은 내용을 다시 올릴 뿐이라 무해하므로, 20분 간격으로 세 번 시도한다.
    # 하나라도 뜨면 공개된다. 셋 다 누락될 확률은 매우 낮다.
    - cron: '45 10 * * *'  # 19:45 KST
    - cron: '5 11 * * *'   # 20:05 KST
    - cron: '25 11 * * *'  # 20:25 KST
  workflow_dispatch:      # 즉시 배포하고 싶을 때 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포를 중간에 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 폰트 서브셋(pyftsubset)에 필요
      - run: pip install fonttools brotli

      - run: npm ci
        working-directory: source

      - run: node build.js
        working-directory: source

      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/out

  # build가 실패하면 needs 조건이 막아서 배포되지 않는다.
  # push로 들어온 실행은 빌드까지만 하고 배포하지 않는다.
  # 실제 공개는 매일 20:00 KST의 schedule 실행(또는 수동 실행)에서만 일어난다.
  deploy:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
